name: nightly

on:
  schedule:
    # Off-peak, deliberately not on the :00/:30 herd marks.
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      soakDuration:
        description: Soak duration (ISO-8601, e.g. PT10M for a smoke run)
        default: PT24H
        required: false

concurrency:
  # A fresh nightly supersedes an overrun previous one (a 24h soak can
  # collide with the next cron tick by design).
  group: nightly
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Soak gate
        run: ./gradlew :tiercache-tck:soakTest -Dtiercache.soak.duration=${{ github.event.inputs.soakDuration || 'PT24H' }}

  pitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: PIT mutation gate (>=75% on core and invalidation)
        run: ./gradlew pitest

  jmh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Informational trend only: hosted runners share vCPUs, so these
      # numbers must never gate. The blocking benchmark gate is a local
      # or dedicated-runner activity (see AGENTS.md).
      - name: JMH baseline (informational)
        run: ./gradlew :tiercache-core:jmh
      - uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: tiercache-core/build/results/jmh/results.txt
          retention-days: 90

  # Budget benchmarks (informational): cascade throughput and invalidation
  # propagation latency. Numbers on hosted runners are trend data, never
  # gates - the budget check is a deliberate local activity (see AGENTS.md).
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cascade throughput benchmark
        run: ./gradlew :tiercache-tck:jmhBenchmark
      - name: Invalidation propagation benchmark
        run: ./gradlew :tiercache-tck:propagationBenchmark
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: tiercache-tck/build/results/
          retention-days: 90

  # Reproducible build (supply-chain design D3): two independent checkouts of
  # the same commit must produce byte-identical shaded jars. setup-gradle
  # caching may share state between the two builds; that is fine - the gate
  # checks source/ordering determinism, not cache isolation.
  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: build-a
      - uses: actions/checkout@v4
        with:
          path: build-b
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build A
        run: ./gradlew :tiercache-core:shadowJar --no-build-cache
        working-directory: build-a
      - name: Build B
        run: ./gradlew :tiercache-core:shadowJar --no-build-cache
        working-directory: build-b
      - name: Compare SHA-256
        run: |
          JAR_A=$(ls build-a/tiercache-core/build/libs/tiercache-core-*.jar | grep -v unshaded)
          JAR_B=$(ls build-b/tiercache-core/build/libs/tiercache-core-*.jar | grep -v unshaded)
          HASH_A=$(sha256sum "$JAR_A" | cut -d' ' -f1)
          HASH_B=$(sha256sum "$JAR_B" | cut -d' ' -f1)
          echo "A: $HASH_A $(stat -c%s "$JAR_A") bytes"
          echo "B: $HASH_B $(stat -c%s "$JAR_B") bytes"
          if [ "$HASH_A" != "$HASH_B" ]; then
            echo "::error::Shaded jars differ - the build is not reproducible"
            diff <(unzip -l "$JAR_A") <(unzip -l "$JAR_B") || true
            exit 1
          fi
          echo "reproducible build OK: $HASH_A"

  # CVE scan (supply-chain design D4): daily Trivy filesystem scan.
  # Non-blocking by design (exit-code 0) - release gating comes later.
  cve-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: '0'
      - name: Append report to job summary
        run: cat trivy-report.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 90

  native-smoke:
    runs-on: ubuntu-latest
    services:
      # The demo's application.yml already points at redis://localhost:6379.
      redis:
        image: redis:6.2-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      # JDK 17 stays available for the compile toolchain; Gradle itself and
      # the native compiler run on GraalVM 25 (the reachability metadata
      # repository requires a newer GraalVM than the 17 line provides).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
      - uses: gradle/actions/setup-gradle@v4
      - name: Native compile
        run: ./gradlew :examples:demo-spring:nativeCompile
      - name: Smoke suite (write, read, repeated read, evict)
        run: |
          BIN=examples/demo-spring/build/native/nativeCompile/demo-spring
          "$BIN" > native-smoke.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          # Readiness: the cache endpoint answering at all (404 = up, key absent).
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/cache/__ping__ || true)
            [ "$code" = "404" ] && break
            sleep 1
          done
          [ "$code" = "404" ] || { echo "app did not become ready (last status: $code)"; exit 1; }
          curl -sf -X PUT -H 'Content-Type: text/plain' -d 'native-smoke-value' http://localhost:8080/cache/smoke
          [ "$(curl -sf http://localhost:8080/cache/smoke)" = "native-smoke-value" ]
          # Repeated read is served from L1.
          [ "$(curl -sf http://localhost:8080/cache/smoke)" = "native-smoke-value" ]
          curl -sf -X DELETE http://localhost:8080/cache/smoke
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/cache/smoke)" = "404" ]
          echo "native smoke OK"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-smoke-log
          path: native-smoke.log
          retention-days: 30
