# Alert rules for Tiercache (Prometheus rule format)

groups:
  - name: tiercache
    rules:
      # Miss growth at stable traffic: requests miss rate grows while total traffic is flat.
      - alert: TiercacheMissGrowth
        expr: |
          sum(rate(tiercache_requests_total{result="miss"}[10m]))
            > 2 * sum(rate(tiercache_requests_total{result="miss"}[10m] offset 30m))
          and sum(rate(tiercache_requests_total[10m]))
            < 1.2 * sum(rate(tiercache_requests_total[10m] offset 30m))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cache miss rate growing without a comparable increase in total traffic"
          runbook_url: "https://github.com/cramen/tier_cache/blob/main/docs/troubleshooting.md#increased-source-load"

      # A fallback clear signals unverifiable history, not a count of lost messages.
      - alert: TiercacheDroppedInvalidations
        expr: sum(rate(tiercache_invalidation_total{direction="dropped"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "L1 fallback clear: inspect trimmed or unverifiable journal history"
          runbook_url: "https://github.com/cramen/tier_cache/blob/main/docs/troubleshooting.md#dropped-invalidations-and-fallback-clears"

      # Degraded mode longer than 5 minutes.
      - alert: TiercacheDegraded
        expr: max(tiercache_degraded) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Cache in L1-only degraded mode > 5 minutes"
          runbook_url: "https://github.com/cramen/tier_cache/blob/main/docs/troubleshooting.md#degraded-or-pending-recovery"

      # A sustained positive failure rate can coexist with successful refreshes.
      - alert: TiercacheRevalidationFailures
        expr: sum(rate(tiercache_l2_revalidation_failures_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SWR revalidations failing for > 10 minutes"
          runbook_url: "https://github.com/cramen/tier_cache/blob/main/docs/troubleshooting.md#loader-and-refresh-failures"

      # Failed PUBLISH is observable but may still represent an ambiguous command.
      - alert: TiercachePublicationFailures
        expr: sum by (cache) (rate(tiercache_invalidation_publish_total{outcome="failed"}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Invalidation publication failures; inspect Redis connectivity and recovery"
          runbook_url: "https://github.com/cramen/tier_cache/blob/main/docs/troubleshooting.md#publication-failures"
