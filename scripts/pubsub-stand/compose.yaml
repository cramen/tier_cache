name: tiercache-pubsub-dispatch
x-api: &api
  image: tiercache-pubsub-dispatch:candidate
  build: .
  mem_limit: 512m
  environment:
    REDIS_URI: redis://redis:6379
  depends_on: [redis, origin]
  logging:
    options: {max-size: 5m, max-file: '2'}
services:
  redis:
    image: redis:6.2-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    ports: ['127.0.0.1:16389:6379']
    mem_limit: 384m
  origin:
    image: python:3.12-slim
    command: [python, /bench/origin.py]
    volumes: ['.:/bench:ro']
    mem_limit: 128m
  app1:
    <<: *api
    ports: ['127.0.0.1:18091:8080']
  app2:
    <<: *api
    ports: ['127.0.0.1:18092:8080']
  app3:
    <<: *api
    ports: ['127.0.0.1:18093:8080']
  app4:
    <<: *api
    ports: ['127.0.0.1:18094:8080']
  app5:
    <<: *api
    ports: ['127.0.0.1:18095:8080']
  app6:
    <<: *api
    ports: ['127.0.0.1:18096:8080']
  balancer:
    image: nginx:alpine
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['127.0.0.1:18090:8080']
    depends_on: [app1, app2, app3, app4, app5, app6]
    mem_limit: 128m
