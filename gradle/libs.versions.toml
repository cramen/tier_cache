[versions]
slf4j = "2.0.16"
caffeine = "3.2.0"
lettuce = "7.7.0.RELEASE"
micrometer = "1.14.14"
otel = "1.49.0"
spring-boot = "3.5.16"
junit = "5.11.4"
testcontainers = "1.21.4"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
otel-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "otel" }
otel-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "otel" }
otel-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "otel" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
cyclonedx = { id = "org.cyclonedx.bom", version = "3.4.1" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
pitest = { id = "info.solidsoft.pitest", version = "1.19.0" }
jmh = { id = "me.champeau.jmh", version = "0.7.3" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
graalvm-native = { id = "org.graalvm.buildtools.native", version = "1.1.12" }
# 0.29.0 (the version proven by the neighboring suffeeex build on Gradle 8.9)
# cannot run on this build's Gradle 9: its java-test-fixtures wiring calls
# Gradle internal APIs whose signatures changed in 9.0. 0.37.0 is the release
# line tested against Gradle 9.4/9.6; its DSL no longer takes a SonatypeHost
# (Central Portal is the only target since 0.34).
vanniktech-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
