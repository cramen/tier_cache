name: tiercache-cluster

services:
  redis:
    image: redis:6.2-alpine
    ports:
      - "6380:6379"

  app:
    build:
      context: ..
      dockerfile: cluster/Dockerfile
    environment:
      TIERCACHE_REDIS_URI: redis://redis:6379
    # Short TTLs for the load test: L1 expires every 10s, L2 every 60s,
    # so a multi-minute run exercises many expiry cycles at both levels.
    # The greetings cache has explicit overrides in application.yml, so it
    # must be overridden per cache (command line wins over the yml).
    command:
      - "--tiercache.defaults.l1-expire-after-write=10s"
      - "--tiercache.defaults.l2-ttl=60s"
      - "--tiercache.caches.greetings.l1-expire-after-write=10s"
      - "--tiercache.caches.greetings.l2-ttl=60s"
    depends_on:
      - redis

  balancer:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - app
