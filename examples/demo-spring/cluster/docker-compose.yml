name: tiercache-cluster

services:
  redis:
    image: redis:6.2-alpine
    ports:
      - "6380:6379"

  app1: &app
    build:
      context: ..
      dockerfile: cluster/Dockerfile
    environment:
      TIERCACHE_REDIS_URI: redis://redis:6379
    ports:
      - "8081:8080"
    depends_on:
      - redis

  app2:
    <<: *app
    ports:
      - "8082:8080"

  app3:
    <<: *app
    ports:
      - "8083:8080"

  balancer:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - app1
      - app2
      - app3
